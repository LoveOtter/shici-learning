name: Publish Shici

on:
  push:
    branches: [main]
    paths-ignore:
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Prepare pinned data and application
        run: |
          python3 -m venv .venv
          .venv/bin/pip install -r scripts/requirements-grammar.txt
          .venv/bin/python scripts/import-eggrolls.py --project . --work .cache/eggrolls-import
          .venv/bin/python scripts/import-grammar.py --project . --work .cache/grammar-import
          .venv/bin/python scripts/import-english.py
          npm ci
          npm run build
          npm test
      - name: Prepare public site
        run: node scripts/prepare-pages.mjs
        env:
          SHICI_PAGES_OUTPUT: _site
      - name: Upload static site
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish website
        id: deployment
        uses: actions/deploy-pages@v4
